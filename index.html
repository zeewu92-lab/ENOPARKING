<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>ENoParking</title>
  <meta name="theme-color" content="#fff7fa" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="语未央" />
  <link rel="apple-touch-icon" href="/pwa-icon.svg" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div id="root">
    <div id="boot-splash" aria-label="语未央啟動" style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:radial-gradient(80% 55% at 50% 8%,#FFF7FA 0%,#FAF7F8 68%,#F5EEF1 100%);color:#211A1E;">
      <div style="position:relative;width:min(100%,520px);height:100%;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div style="position:absolute;top:calc(50% - 166px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:7px;">
          <strong style="font:850 clamp(34px,9vw,48px)/1 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;letter-spacing:.06em;color:#2A2025;">语未央</strong>
          <span style="font:800 9px/1 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;letter-spacing:.28em;color:#9D2759;">ENOPARKING</span>
        </div>
        <div style="position:absolute;left:50%;bottom:calc(50% - 116px);width:300px;height:190px;transform:translateX(-50%);">
          <div style="position:absolute;width:70px;height:70px;right:16px;top:4px;border-radius:50%;background:radial-gradient(circle,#FFF4D2 0%,#FFE7A1 42%,transparent 72%);opacity:.72;"></div>
          <div style="position:absolute;left:-30px;bottom:26px;width:360px;height:76px;border-radius:50% 50% 0 0;background:#D8E6D9;"></div>
          <div style="position:absolute;left:-45px;bottom:26px;width:390px;height:55px;border-radius:50% 50% 0 0;background:#C5DDBE;"></div>
          <div style="position:absolute;left:50%;bottom:19px;width:92px;height:18px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#8F806D 0%,#A99A88 60%,transparent 72%);opacity:.62;"></div>
          <div style="position:absolute;left:50%;bottom:25px;width:100px;height:145px;transform:translateX(-50%);">
            <span style="position:absolute;left:50%;bottom:18px;width:5px;height:100px;border-radius:99px;background:linear-gradient(180deg,#78A56D,#5E8F65);transform:translateX(-50%);"></span>
            <i style="position:absolute;left:11px;bottom:72px;width:34px;height:18px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#8CB47D,#5E9668);transform:rotate(-26deg);"></i>
            <i style="position:absolute;right:11px;bottom:72px;width:34px;height:18px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#8CB47D,#5E9668);transform:scaleX(-1) rotate(-26deg);"></i>
            <b style="position:absolute;left:50%;top:4px;width:58px;height:58px;transform:translateX(-50%);">
              <i style="position:absolute;left:50%;top:7px;width:25px;height:40px;transform:translateX(-50%) rotate(0deg);transform-origin:50% 100%;border-radius:55% 55% 48% 48%;background:linear-gradient(180deg,#F48FB4,#E84A8A);"></i>
              <i style="position:absolute;left:50%;top:7px;width:25px;height:40px;transform:translateX(-50%) rotate(72deg);transform-origin:50% 100%;border-radius:55% 55% 48% 48%;background:linear-gradient(180deg,#F48FB4,#E84A8A);"></i>
              <i style="position:absolute;left:50%;top:7px;width:25px;height:40px;transform:translateX(-50%) rotate(144deg);transform-origin:50% 100%;border-radius:55% 55% 48% 48%;background:linear-gradient(180deg,#F48FB4,#E84A8A);"></i>
              <i style="position:absolute;left:50%;top:7px;width:25px;height:40px;transform:translateX(-50%) rotate(216deg);transform-origin:50% 100%;border-radius:55% 55% 48% 48%;background:linear-gradient(180deg,#F48FB4,#E84A8A);"></i>
              <i style="position:absolute;left:50%;top:7px;width:25px;height:40px;transform:translateX(-50%) rotate(288deg);transform-origin:50% 100%;border-radius:55% 55% 48% 48%;background:linear-gradient(180deg,#F48FB4,#E84A8A);"></i>
              <em style="position:absolute;left:50%;top:25px;width:15px;height:15px;transform:translate(-50%,-50%);border-radius:50%;background:#F4C85A;"></em>
            </b>
          </div>
        </div>
        <div style="position:absolute;bottom:calc(50% - 186px);display:flex;align-items:center;gap:5px;min-height:20px;font:12px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;letter-spacing:.04em;color:#756A70;">
          <span>正在启动</span><i style="font-style:normal;letter-spacing:2px;color:#E84A8A;">•••</i>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
