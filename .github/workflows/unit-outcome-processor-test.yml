name: unit-outcome-processor-test

on:
  push:
    paths:
      - 'src/features/learning/unitOutcomeProcessor.js'
      - 'src/features/learning/unitOutcomeProcessor.test.js'
      - 'shared/learning/**'
      - 'simulator/MasteryCalculator.js'
      - '.github/workflows/unit-outcome-processor-test.yml'
  pull_request:
    paths:
      - 'src/features/learning/unitOutcomeProcessor.js'
      - 'src/features/learning/unitOutcomeProcessor.test.js'
      - 'shared/learning/**'
      - 'simulator/MasteryCalculator.js'
      - '.github/workflows/unit-outcome-processor-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/verification-selector
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/features/learning/unitOutcomeProcessor.test.js
