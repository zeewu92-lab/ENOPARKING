name: simulator-verify

on:
  push:
    paths:
      - 'simulator/**'
      - '.github/workflows/simulator-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node simulator/verify.js
