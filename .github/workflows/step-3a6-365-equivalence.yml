name: step-3a6-365-equivalence

on:
  workflow_dispatch:
  push:
    branches:
      - feature/verification-selector
    paths:
      - 'shared/learning/**'
      - 'simulator/DimensionUpdater.js'
      - 'simulator/run365.js'
      - 'simulator/DailyBatch.js'
      - 'simulator/EventProcessor.js'
      - 'simulator/MasteryCalculator.js'
      - 'simulator/Scheduler.js'
      - 'simulator/StabilityEngine.js'
      - 'scripts/verify-365-equivalence-*.js'
      - '.github/workflows/step-3a6-365-equivalence.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout current
        uses: actions/checkout@v4
        with:
          ref: feature/verification-selector
          path: current
          fetch-depth: 0

      - name: Checkout legacy
        uses: actions/checkout@v4
        with:
          ref: 565ffaa727a9be52257dad58f6eddd6df3647797
          path: legacy
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy harness to legacy
        run: |
          mkdir -p legacy/scripts
          cp current/scripts/verify-365-equivalence-snapshot.js legacy/scripts/
          cp current/scripts/verify-365-equivalence-compare.js legacy/scripts/

      - name: Snapshot legacy
        working-directory: legacy
        run: node scripts/verify-365-equivalence-snapshot.js before.jsonl

      - name: Snapshot current
        working-directory: current
        run: node scripts/verify-365-equivalence-snapshot.js after.jsonl

      - name: Compare
        working-directory: current
        run: node scripts/verify-365-equivalence-compare.js ../legacy/before.jsonl after.jsonl

      - name: Record snapshot hashes
        if: always()
        run: |
          sha256sum legacy/before.jsonl current/after.jsonl | tee 365-snapshot-sha256.txt

      - name: Upload equivalence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-3a6-equivalence-evidence
          path: |
            365-snapshot-sha256.txt
          retention-days: 7
